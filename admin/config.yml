backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/uploads"

media_library:
  name: cloudinary
  config:
    cloud_name: gnzhxcau
    api_key: 869491552173931
    



collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: "layouts/post.njk" }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Category, name: category, widget: select, options: ["Stories", "Poetry", "Islamic", "Personal"], default: "Personal" }
      - { label: Body, name: body, widget: markdown }

  - name: photos
    label: Photo Albums
    folder: content/photos
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/album"
    media_folder: "content/uploads/photos"
    public_folder: "/uploads/photos"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: "layouts/gallery.njk" }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Images, name: images, widget: list, field: { label: Image, name: image, widget: image } }
      - { label: Description, name: body, widget: markdown, required: false }

  - name: poems
    label: Poems
    folder: content/poems
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/poem"
    media_folder: "content/uploads/poems"
    public_folder: "/uploads/poems"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: "layouts/poem.njk" }
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: Audio File, name: audio, widget: file }
      - { label: Poem Text, name: body, widget: markdown, required: false }